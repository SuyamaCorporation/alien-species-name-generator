<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宇宙人種族名前ジェネレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeInUp 0.4s ease-out; }
    .bar-fill { transition: width 0.6s cubic-bezier(.4,0,.2,1); }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen font-sans text-gray-100">
  <div class="max-w-2xl mx-auto px-4 py-8">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-purple-300 mb-2">👽 宇宙人種族名前ジェネレーター</h1>
      <p class="text-gray-400 text-sm">SF風の種族名と文明特徴をランダム生成</p>
    </header>

    <!-- Sound Style Selector -->
    <section aria-label="音韻スタイル選択" class="mb-6">
      <p class="text-sm font-semibold text-gray-400 mb-3">音韻スタイルを選択</p>
      <div class="grid grid-cols-3 gap-3" role="radiogroup" aria-label="音韻スタイル">
        <button role="radio" aria-checked="false" data-style="harsh"
          onclick="selectStyle(this)"
          class="style-btn p-3 rounded-xl border-2 border-gray-700 bg-gray-800 hover:border-red-500 transition text-center focus:outline-none focus:ring-2 focus:ring-red-400">
          <div class="text-2xl mb-1">⚡</div>
          <div class="text-sm font-bold text-red-300">硬音</div>
          <div class="text-xs text-gray-400 mt-1">K・G・R・X系</div>
        </button>
        <button role="radio" aria-checked="false" data-style="soft"
          onclick="selectStyle(this)"
          class="style-btn p-3 rounded-xl border-2 border-gray-700 bg-gray-800 hover:border-blue-400 transition text-center focus:outline-none focus:ring-2 focus:ring-blue-400">
          <div class="text-2xl mb-1">🌙</div>
          <div class="text-sm font-bold text-blue-300">軟音</div>
          <div class="text-xs text-gray-400 mt-1">L・M・N・S系</div>
        </button>
        <button role="radio" aria-checked="false" data-style="sibilant"
          onclick="selectStyle(this)"
          class="style-btn p-3 rounded-xl border-2 border-gray-700 bg-gray-800 hover:border-teal-400 transition text-center focus:outline-none focus:ring-2 focus:ring-teal-400">
          <div class="text-2xl mb-1">💨</div>
          <div class="text-sm font-bold text-teal-300">シュー音</div>
          <div class="text-xs text-gray-400 mt-1">SH・ZH・CH系</div>
        </button>
      </div>
      <button onclick="selectRandomStyle()" class="mt-3 text-xs text-gray-500 hover:text-gray-300 underline" aria-label="スタイルをランダムに選ぶ">ランダムで選ぶ</button>
    </section>

    <!-- Generate Button -->
    <div class="flex justify-center mb-8">
      <button onclick="generateSpecies()" id="generateBtn"
        aria-label="種族名を生成する"
        class="px-10 py-4 bg-purple-600 hover:bg-purple-500 active:scale-95 text-white text-xl font-bold rounded-full shadow-lg transition-all focus:outline-none focus:ring-4 focus:ring-purple-400">
        🛸 生成する
      </button>
    </div>

    <!-- Result Card -->
    <div id="resultCard" class="hidden mb-8">
      <div class="bg-gray-800 border border-purple-800 rounded-2xl p-6 fade-in">
        <div class="flex items-start justify-between mb-4">
          <div>
            <h2 id="speciesName" class="text-4xl font-black tracking-widest text-purple-200 mb-1"></h2>
            <p id="speciesPhonetic" class="text-sm text-gray-400 italic"></p>
          </div>
          <div class="flex gap-2">
            <button onclick="copyName()" aria-label="種族名をコピー"
              class="px-3 py-1.5 text-xs bg-gray-700 hover:bg-gray-600 rounded-lg transition focus:outline-none focus:ring-2 focus:ring-purple-400">
              📋 コピー
            </button>
            <button onclick="saveSpecies()" id="saveBtn" aria-label="種族を保存"
              class="px-3 py-1.5 text-xs bg-gray-700 hover:bg-gray-600 rounded-lg transition focus:outline-none focus:ring-2 focus:ring-purple-400">
              🤍 保存
            </button>
          </div>
        </div>

        <!-- Parameters -->
        <div class="space-y-3 mb-4" aria-label="種族パラメーター">
          <div class="flex items-center gap-3">
            <span class="text-xs text-gray-400 w-16 shrink-0">凶暴度</span>
            <div class="flex-1 bg-gray-700 rounded-full h-3" role="meter" aria-label="凶暴度">
              <div id="barAggression" class="bar-fill h-3 rounded-full bg-red-500" style="width:0%"></div>
            </div>
            <span id="valAggression" class="text-xs font-bold text-red-300 w-6 text-right"></span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs text-gray-400 w-16 shrink-0">知性</span>
            <div class="flex-1 bg-gray-700 rounded-full h-3" role="meter" aria-label="知性">
              <div id="barIntelligence" class="bar-fill h-3 rounded-full bg-blue-400" style="width:0%"></div>
            </div>
            <span id="valIntelligence" class="text-xs font-bold text-blue-300 w-6 text-right"></span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs text-gray-400 w-16 shrink-0">社会性</span>
            <div class="flex-1 bg-gray-700 rounded-full h-3" role="meter" aria-label="社会性">
              <div id="barSocial" class="bar-fill h-3 rounded-full bg-green-400" style="width:0%"></div>
            </div>
            <span id="valSocial" class="text-xs font-bold text-green-300 w-6 text-right"></span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs text-gray-400 w-16 shrink-0">技術力</span>
            <div class="flex-1 bg-gray-700 rounded-full h-3" role="meter" aria-label="技術力">
              <div id="barTech" class="bar-fill h-3 rounded-full bg-yellow-400" style="width:0%"></div>
            </div>
            <span id="valTech" class="text-xs font-bold text-yellow-300 w-6 text-right"></span>
          </div>
        </div>

        <!-- Description -->
        <p id="speciesDesc" class="text-sm text-gray-300 leading-relaxed border-t border-gray-700 pt-4"></p>
        <div id="copiedMsg" class="hidden text-xs text-green-400 mt-2">✓ コピーしました</div>
      </div>
    </div>

    <!-- History -->
    <section aria-label="生成履歴">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-gray-400">📜 生成履歴（最大20件）</h2>
        <button onclick="clearHistory()" class="text-xs text-gray-600 hover:text-red-400 underline" aria-label="履歴をクリア">クリア</button>
      </div>
      <ul id="historyList" class="space-y-2 max-h-72 overflow-y-auto"></ul>
      <p id="historyEmpty" class="text-gray-600 text-xs italic">まだ生成履歴がありません</p>
    </section>
  </div>

  <script>
    const SYLLABLES = {
      harsh: {
        starts: ['Kr','Gr','Rax','Kor','Grak','Xar','Krix','Gor','Ruk','Xak','Kar','Grex','Rox','Kur','Grix'],
        mids:   ['ax','ok','ur','ix','ak','or','ux','ar','ek','ox'],
        ends:   ['on','ak','ox','ix','ur','ar','ek','um','an','ok']
      },
      soft: {
        starts: ['Mel','Nas','Lori','Mun','Sal','Nis','Lan','Mira','Nelu','Sali','Lomi','Mena','Noru','Selu','Lani'],
        mids:   ['ori','una','elu','ani','onu','ari','elu','ino','anu','olu'],
        ends:   ['ri','na','la','mi','ne','li','ra','ni','ma','lo']
      },
      sibilant: {
        starts: ['Sho','Zhe','Cha','Shi','Zho','Sha','Zha','Cho','Shi','Zhe','Sha','Cho','Zhi','She','Cha'],
        mids:   ['za','shi','zho','cha','zhe','sho','chi','zha','she','cho'],
        ends:   ['ri','ven','zan','shi','ren','zho','van','sha','zen','zhi']
      }
    };

    const STYLE_COLORS = {
      harsh:    { text: 'text-red-300', border: 'border-red-500', active: 'border-red-500 bg-red-950' },
      soft:     { text: 'text-blue-300', border: 'border-blue-400', active: 'border-blue-400 bg-blue-950' },
      sibilant: { text: 'text-teal-300', border: 'border-teal-400', active: 'border-teal-400 bg-teal-950' }
    };

    let selectedStyle = null;
    let currentSpecies = null;

    function selectStyle(btn) {
      document.querySelectorAll('.style-btn').forEach(b => {
        b.setAttribute('aria-checked', 'false');
        b.className = b.className.replace(/border-\S+\s+bg-\S+950/g, 'border-gray-700 bg-gray-800');
      });
      btn.setAttribute('aria-checked', 'true');
      selectedStyle = btn.dataset.style;
      const col = STYLE_COLORS[selectedStyle];
      btn.classList.remove('border-gray-700', 'bg-gray-800');
      btn.classList.add(col.border.replace('border-','border-'), col.active.split(' ')[1]);
      btn.style.borderColor = '';
      btn.className = `style-btn p-3 rounded-xl border-2 ${col.active} transition text-center focus:outline-none focus:ring-2 focus:ring-purple-400`;
    }

    function selectRandomStyle() {
      const styles = ['harsh','soft','sibilant'];
      const btn = document.querySelector(`[data-style="${styles[Math.floor(Math.random()*3)]}"]`);
      selectStyle(btn);
    }

    function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function generateName(style) {
      const s = SYLLABLES[style];
      const len = Math.random() < 0.4 ? 2 : 3;
      let name = rand(s.starts);
      if (len === 3) name += rand(s.mids);
      name += rand(s.ends);
      return name.charAt(0).toUpperCase() + name.slice(1);
    }

    function generateDesc(name, params) {
      const { aggression, intelligence, social, tech } = params;
      const parts = [];

      if (aggression >= 8) parts.push(`${name}族は銀河でも屈指の好戦的な種族として知られ、`);
      else if (aggression <= 3) parts.push(`${name}族は平和を愛する穏やかな種族であり、`);
      else parts.push(`${name}族は自衛のための戦闘能力を持ちながらも、`);

      if (intelligence >= 8) parts.push(`高度な知性と論理的思考で知られる。`);
      else if (intelligence <= 3) parts.push(`本能と直感を重視した行動様式をとる。`);
      else parts.push(`実用的な知恵と経験を積み重ねてきた。`);

      if (social >= 8) parts.push(`強い集団意識を持ち、個よりも集団の利益を優先する文化を持つ。`);
      else if (social <= 3) parts.push(`個人主義的な気質が強く、孤立した生活様式を好む傾向がある。`);
      else parts.push(`小規模な部族単位での社会構造を維持している。`);

      if (tech >= 9) parts.push(`その技術力は宇宙でも最高水準であり、ワープ技術や反物質エネルギーを操る。`);
      else if (tech >= 6) parts.push(`恒星間移動を可能にする技術レベルに達している。`);
      else if (tech >= 4) parts.push(`惑星内での高度な文明を築いているが、宇宙進出はまだ先の話だ。`);
      else parts.push(`原始的な道具と自然の力を組み合わせた独自の技術体系を持つ。`);

      return parts.join('');
    }

    function generateSpecies() {
      const style = selectedStyle || ['harsh','soft','sibilant'][randInt(0,2)];
      const name = generateName(style);
      const params = {
        aggression:  randInt(1,10),
        intelligence: randInt(1,10),
        social:      randInt(1,10),
        tech:        randInt(1,10)
      };
      const phonetic = { harsh: '（硬音系）', soft: '（軟音系）', sibilant: '（シュー音系）' }[style];

      currentSpecies = { name, params, phonetic, style, timestamp: Date.now() };

      // Update UI
      document.getElementById('resultCard').classList.remove('hidden');
      document.getElementById('speciesName').textContent = name;
      document.getElementById('speciesPhonetic').textContent = phonetic;
      document.getElementById('speciesDesc').textContent = generateDesc(name, params);

      setTimeout(() => {
        document.getElementById('barAggression').style.width = (params.aggression * 10) + '%';
        document.getElementById('barIntelligence').style.width = (params.intelligence * 10) + '%';
        document.getElementById('barSocial').style.width = (params.social * 10) + '%';
        document.getElementById('barTech').style.width = (params.tech * 10) + '%';
      }, 50);

      document.getElementById('valAggression').textContent = params.aggression;
      document.getElementById('valIntelligence').textContent = params.intelligence;
      document.getElementById('valSocial').textContent = params.social;
      document.getElementById('valTech').textContent = params.tech;

      updateSaveBtn();

      // Add to history
      let history = JSON.parse(localStorage.getItem('alien_history') || '[]');
      history.unshift(currentSpecies);
      if (history.length > 20) history = history.slice(0, 20);
      localStorage.setItem('alien_history', JSON.stringify(history));
      renderHistory();

      // Re-trigger fade
      const card = document.getElementById('resultCard');
      card.querySelector('.fade-in').classList.remove('fade-in');
      void card.offsetWidth;
      card.querySelector('div').classList.add('fade-in');
    }

    function updateSaveBtn() {
      const saved = JSON.parse(localStorage.getItem('alien_saved') || '[]');
      const isSaved = saved.some(s => s.name === currentSpecies?.name && s.timestamp === currentSpecies?.timestamp);
      const btn = document.getElementById('saveBtn');
      if (btn) {
        btn.textContent = isSaved ? '❤️ 保存済' : '🤍 保存';
        btn.setAttribute('aria-label', isSaved ? '保存から削除' : '種族を保存');
      }
    }

    function saveSpecies() {
      if (!currentSpecies) return;
      let saved = JSON.parse(localStorage.getItem('alien_saved') || '[]');
      const idx = saved.findIndex(s => s.name === currentSpecies.name && s.timestamp === currentSpecies.timestamp);
      if (idx >= 0) {
        saved.splice(idx, 1);
      } else {
        saved.unshift(currentSpecies);
        if (saved.length > 20) saved = saved.slice(0, 20);
      }
      localStorage.setItem('alien_saved', JSON.stringify(saved));
      updateSaveBtn();
    }

    function copyName() {
      if (!currentSpecies) return;
      navigator.clipboard.writeText(currentSpecies.name).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = currentSpecies.name;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      });
      const msg = document.getElementById('copiedMsg');
      msg.classList.remove('hidden');
      setTimeout(() => msg.classList.add('hidden'), 2000);
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('alien_history') || '[]');
      const list = document.getElementById('historyList');
      const empty = document.getElementById('historyEmpty');
      list.innerHTML = '';
      if (history.length === 0) { empty.style.display = ''; return; }
      empty.style.display = 'none';
      history.forEach(sp => {
        const li = document.createElement('li');
        const col = STYLE_COLORS[sp.style] || STYLE_COLORS.harsh;
        li.className = 'flex items-center gap-3 bg-gray-800/60 rounded-lg px-3 py-2 text-sm';
        li.innerHTML = `
          <span class="font-bold ${col.text /* xss-ok: STYLE_COLORSハードコードマップのCSSクラス文字列 */} tracking-wide">${sp.name /* xss-ok: generateName()がSYLLABLESハードコード配列から生成した名前 */}</span>
          <span class="text-gray-500 text-xs">${sp.phonetic /* xss-ok: ハードコードphoneticマップの値 */}</span>
          <div class="ml-auto flex gap-2 text-xs text-gray-500">
            <span>凶 ${sp.params.aggression /* xss-ok: randInt(1,10)生成の整数 */}</span>
            <span>知 ${sp.params.intelligence /* xss-ok: randInt(1,10)生成の整数 */}</span>
            <span>社 ${sp.params.social /* xss-ok: randInt(1,10)生成の整数 */}</span>
            <span>技 ${sp.params.tech /* xss-ok: randInt(1,10)生成の整数 */}</span>
          </div>
        `;
        list.appendChild(li);
      });
    }

    function clearHistory() {
      if (!confirm('履歴をすべて削除しますか？')) return;
      localStorage.removeItem('alien_history');
      renderHistory();
    }

    renderHistory();
  </script>
</body>
</html>
